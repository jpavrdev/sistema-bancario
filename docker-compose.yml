services:
  db:
    image: postgres:18
    container_name: bancario-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql
volumes:
  pgdata:
